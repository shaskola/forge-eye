name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Empaquetar EXE de Windows
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/ForgeEye-Setup-*.exe
            release/ForgeEye-Portable-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ForgeEye-Setup-*.exe
            release/ForgeEye-Portable-*.exe
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
